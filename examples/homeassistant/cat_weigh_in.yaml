# Kitchen-scale weigh-ins for cat identification, as a Home Assistant package.
#
# Requires CATLINK_CATS, e.g. CATLINK_CATS=cat_a=3.20,cat_b=4.60. Replace cat_a / cat_b with your slugs; for
# one cat, delete the cat_b parts; for a third cat, copy them. Topics assume the default CATLINK_BASE
# (catlink/litterbox). Works in both modes: the set_ref topics are handled inside the gateway and never
# reach the box.
#
# A weigh-in is a measurement for a cat the tracker already knows, and the way to tell the cats apart when
# it cannot: "Cat ID status" then reads "Weigh every cat". Weigh EVERY cat and enter each value within a day
# (a weigh-in session); a single value waits ("pending"). The result of each entry is on the
# "<Cat> last weigh-in" sensor (accepted / pending / rejected + why).
#
# These helpers send a value only when it CHANGES. To repeat or confirm a weight (e.g. one that was rejected
# as far from the cat's track), enter it changed by 0.01 kg (3.31 for 3.30): the tracker takes values within
# 50 g as the same confirmation.
#
# Install as a package: save as <config>/packages/catlink_weigh_in.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant. (Or copy the input_number entries into configuration.yaml and the two
# automations into automations.yaml.)

input_number:
  catlink_cat_a_weigh_in:
    name: Cat a weigh-in
    min: 0.5
    max: 10
    step: 0.01
    unit_of_measurement: kg
    mode: box
    icon: mdi:scale
  catlink_cat_b_weigh_in:
    name: Cat b weigh-in
    min: 0.5
    max: 10
    step: 0.01
    unit_of_measurement: kg
    mode: box
    icon: mdi:scale

automation:
- id: catlink_weigh_in_cat_a
  alias: 'CATLINK: publish cat_a weigh-in'
  description: Send a kitchen-scale weight of cat_a to the gateway.
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_number.catlink_cat_a_weigh_in
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state.state not in ['unknown', 'unavailable', 'none']
         and trigger.from_state.state not in ['unknown', 'unavailable', 'none'] }}
  actions:
  - action: mqtt.publish
    data:
      topic: catlink/litterbox/set_ref_cat_a/set
      payload: "{{ states('input_number.catlink_cat_a_weigh_in') }}"

- id: catlink_weigh_in_cat_b
  alias: 'CATLINK: publish cat_b weigh-in'
  description: Send a kitchen-scale weight of cat_b to the gateway.
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_number.catlink_cat_b_weigh_in
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state.state not in ['unknown', 'unavailable', 'none']
         and trigger.from_state.state not in ['unknown', 'unavailable', 'none'] }}
  actions:
  - action: mqtt.publish
    data:
      topic: catlink/litterbox/set_ref_cat_b/set
      payload: "{{ states('input_number.catlink_cat_b_weigh_in') }}"
